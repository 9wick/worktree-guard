[package]
name = "worktree-guard"
version = "0.1.1"
edition = "2021"
license = "MIT"
rust-version = "1.85"
authors = ["KoheiKido <kido@9wick.com>"]
repository = "https://github.com/9wick/worktree-guard"
homepage = "https://github.com/9wick/worktree-guard"
description = "Git hook helper that enforces worktree isolation rules: prevents commits in root worktree and branch switching on protected branches."
readme = "README.md"
keywords = ["git", "worktree", "hook", "cli", "lefthook"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "worktree-guard"
path = "src/main.rs"

[dependencies]
clap = { version = "=4.6.1", features = ["derive"] }
anyhow = "=1.0.102"

[dev-dependencies]
assert_cmd = "=2.2.1"
predicates = "=3.1.4"
tempfile = "=3.27.0"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
opt-level = 3

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
